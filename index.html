<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Lokale Begleitung für drei manuelle Blutdruckmessungen." />
    <meta name="theme-color" content="#125b91" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Blutdruck" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="icon" href="icons/favicon-32.png?v=3" type="image/png" sizes="32x32" />
    <title>Blutdruckmessung</title>
    <script>
      if (location.hostname === "localhost"
        || location.hostname === "127.0.0.1"
        || location.hostname.endsWith(".app.github.dev")) {
        navigator.serviceWorker?.getRegistrations()
          .then((registrations) => Promise.all(
            registrations
              .filter((registration) => new URL(registration.scope).pathname.startsWith("/blutdruck/"))
              .map((registration) => registration.unregister()),
          ))
          .then(() => caches.keys())
          .then((keys) => Promise.all(
            keys
              .filter((key) => key.startsWith("blutdruck-app-"))
              .map((key) => caches.delete(key)),
          ))
          .catch((error) => {
            console.error("Alte Entwicklungs-Service-Worker konnten nicht entfernt werden.", error);
          });
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts?v=4"></script>
  </body>
</html>
